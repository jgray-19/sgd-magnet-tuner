# Runs all tests and runs a coverage report via python-coverage-comment-action.
name: Coverage

on:  # Runs on all push events to main branch and any push related to a pull request
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Allow manual triggering

env:
  UV_COMPILE_BYTECODE: 1

defaults:
  run:
    shell: bash
    working-directory: sgd-magnet-tuner

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      # Gives the action the necessary permissions for pushing data to the
      # python-coverage-comment-action branch, and for editing existing
      # comments (to avoid publishing multiple comments in the same PR)
      contents: write
    env:
        python-version: "3.13"

    steps:
      - uses: actions/checkout@v5
        with:
          path: sgd-magnet-tuner
          persist-credentials: true

      - uses: actions/checkout@v5
        with:
          repository: jgray-19/pymadng-utils
          path: pymadng-utils

      - uses: actions/checkout@v5
        with:
          repository: jgray-19/tmom-recon
          path: tmom-recon

      - uses: actions/checkout@v5
        with:
          repository: jgray-19/xtrack_tools
          path: xtrack-tools

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.python-version }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: 'sgd-magnet-tuner/pyproject.toml'

      - name: Ensure pip, setuptools and wheel
        run: uv pip install --upgrade pip setuptools wheel

      # The uv pip should make & use an env from the Python install of the previous step
      - name: Install package
        run: uv pip install -e '.[test,tracking]'

      - name: Run parallel non-serial tests
        run: pytest -ra -n auto -m "not serial" --cov=aba_optimiser --cov-branch

      - name: Run serial loss regression tests
        run: pytest -ra -m serial -k "loss_regression" --cov=aba_optimiser --cov-branch --cov-append

      - name: Run remaining serial tests
        run: pytest -ra -m serial -k "not loss_regression" --cov=aba_optimiser --cov-branch --cov-append --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
